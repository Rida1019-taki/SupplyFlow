<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplyFlow | Nouveau Fournisseur</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>
    <h1><i class="fas fa-boxes-packing"></i> SupplyFlow Logistics</h1>
</header>

<nav>
    <a href="/">Tableau de bord</a>
    <a href="/produits">Produits</a>
    <a href="/fournisseur" class="active">Fournisseurs</a>
    <a href="/mouvements">Mouvements Stock</a>
</nav>

<div class="container">
    <div class="form-card">
        <h2><i class="fas fa-truck"></i> Ajouter un fournisseur</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Remplissez les informations pour le nouveau partenaire.</p>

        <form th:action="@{/fournisseur/ajouter}" th:object="${fournisseur}" method="post">
            <div class="form-group">
                <label>Nom du Fournisseur</label>
                <input type="text" th:field="*{nom}" placeholder="Ex: LogiCorp SA" required>
            </div>

            <div class="form-group">
                <label>Ville</label>
                <input type="text" th:field="*{ville}" placeholder="Ex: Paris" required>
            </div>

            <div class="form-group">
                <label>Téléphone</label>
                <input type="text" th:field="*{telefone}" placeholder="Ex: +33 1 23 45 67 89" required>
            </div>

            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn"><i class="fas fa-save"></i> Enregistrer</button>
                <a href="/fournisseur" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
