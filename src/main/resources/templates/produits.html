<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produits</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h2>Liste des Produits</h2>

<a href="/produits/ajouter" class="btn">Ajouter Produit</a>

<table>
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Catégorie</th>
        <th>Prix</th>
        <th>Quantité</th>
        <th>Actions</th>
    </tr>

    <tr th:each="p : ${produits}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nom}"></td>
        <td th:text="${p.categorie}"></td>
        <td th:text="${p.prix}"></td>
        <td th:text="${p.quantite}"></td>
        <td>
            <a th:href="@{/produits/edit/{id}(id=${p.id})}">Modifier</a>
            <a th:href="@{/produits/delete/{id}(id=${p.id})}">Supprimer</a>
        </td>
    </tr>

</table>

</body>
</html>
