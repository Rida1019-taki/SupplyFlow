<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplyFlow | Produits</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>
    <h1><i class="fas fa-boxes-packing"></i> SupplyFlow Logistics</h1>
</header>

<nav>
    <a href="/">Tableau de bord</a>
    <a href="/produits" class="active">Produits</a>
    <a href="/fournisseur">Fournisseurs</a>
    <a href="/mouvements">Mouvements Stock</a>
</nav>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2>Liste des Produits</h2>
        <a href="/produits/ajouter" class="btn"><i class="fas fa-plus"></i> Ajouter Produit</a>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Catégorie</th>
                    <th>Prix</th>
                    <th>Quantité</th>
                    <th>Fournisseur</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${produits}">
                    <td th:text="${p.id}"></td>
                    <td style="font-weight: 600;" th:text="${p.nom}"></td>
                    <td><span class="badge badge-info" th:text="${p.categorie}"></span></td>
                    <td th:text="${p.prix + ' DH'}"></td>
                    <td th:text="${p.quantity}"></td>
                    <td th:text="${p.fournisseur != null ? p.fournisseur.nom : 'Founisseur introuvable'}"></td>
                    <td>
                        <a th:href="@{/produits/modifier/{id}(id=${p.id})}" style="color: var(--primary); margin-right: 1rem;"><i class="fas fa-edit"></i></a>
                        <a th:href="@{/produits/supprimer/{id}(id=${p.id})}" style="color: var(--danger);"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
