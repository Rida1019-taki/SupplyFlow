<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupplyFlow | Modifier Produit</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>
    <h1><i class="fas fa-boxes-packing"></i> SupplyFlow Logistics</h1>
</header>

<nav>
    <a href="/">Tableau de bord</a>
    <a href="/produits" class="active">Produits</a>
    <a href="/fournisseur">Fournisseurs</a>
    <a href="/mouvements">Mouvements Stock</a>
</nav>

<div class="container">
    <div class="form-card">
        <h2><i class="fas fa-edit"></i> Modifier le produit</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Mettez à jour les informations du produit ci-dessous.</p>

        <form th:action="@{/produits/modifier/{id}(id=${produit.id})}" th:object="${produit}" method="post">
            <div class="form-group">
                <label>Nom du produit</label>
                <input type="text" th:field="*{nom}" placeholder="Ex: Palette Bois" required>
            </div>

            <div class="form-group">
                <label>Catégorie</label>
                <input type="text" th:field="*{categorie}" placeholder="Ex: Stockage" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Prix Unitaire (€)</label>
                    <input type="number" step="0.01" th:field="*{prix}" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label>Quantité</label>
                    <input type="number" th:field="*{quantity}" placeholder="0" required>
                </div>
            </div>

            <div class="form-group">
                <label>Fournisseur</label>
                <select th:field="*{fournisseur.idFournisseur}" class="form-control" required>
                    <option value="" disabled>Choisir un fournisseur</option>
                    <option th:each="f : ${fournisseurs}" th:value="${f.idFournisseur}" th:text="${f.nom}"></option>
                </select>
            </div>

            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn"><i class="fas fa-save"></i> Enregistrer les modifications</button>
                <a href="/produits" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
